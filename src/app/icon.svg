<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2f3fe0" />
      <stop offset="1" stop-color="#212ea8" />
    </linearGradient>
  </defs>
  <rect width="100" height="100" rx="22.5" fill="url(#bg)" />
  <!-- Braille cell (dots numbered 1,2,3 top-to-bottom left column; 4,5,6
