  <circle cx="38" cy="50" r="5.2" fill="#ffffff" />
  <circle cx="62" cy="35" r="4" fill="none" stroke="#ffffff" stroke-opacity="0.28" stroke-width="1.2" />
  <circle cx="38" cy="65" r="4" fill="none" stroke="#ffffff" stroke-opacity="0.28" stroke-width="1.2" />
  <circle cx="62" cy="50" r="4" fill="none" stroke="#ffffff" stroke-opacity="0.28" stroke-width="1.2" />
  <circle cx="62" cy="65" r="4" fill="none" stroke="#ffffff" stroke-opacity="0.28" stroke-width="1.2" />
</svg>
